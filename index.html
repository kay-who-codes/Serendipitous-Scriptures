<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Serendipitous Scriptures</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0b0d10;
    --bg-raised: #14171c;
    --ink: #ece7dc;
    --ink-dim: #8b8f96;
    --rule: #262b32;
    --ember: #c98a4b;
    --ember-dim: #6b5638;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(32px, 8vw, 64px) clamp(16px, 5vw, 24px) 100px;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ember);
    margin: 0 0 10px;
  }

  h1{
    font-weight: 500;
    font-size: clamp(28px, 8vw, 44px);
    line-height: 1.08;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  h1 em{
    font-style: italic;
    color: var(--ember);
  }

  .sub{
    color: var(--ink-dim);
    font-size: clamp(15px, 4vw, 19px);
    line-height: 1.5;
    margin: 0 0 32px;
    max-width: 52ch;
  }

  /* the input — a single ledger line */
  .entry{
    display:flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 12px 18px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 8px;
  }
  .entry input{
    flex: 1 1 140px;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(24px, 7vw, 34px);
    letter-spacing: 0.05em;
    padding: 6px 0;
    width: 100%;
  }
  .entry input::placeholder{ color: #3a3f47; }
  .entry .go{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: none;
    border: 1px solid var(--rule);
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
    flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  .entry .go:hover, .entry .go:active{ border-color: var(--ember); color: var(--ember); }

  /* ordering filter chips */
  .order-filter{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 6px;
  }
  .order-filter .chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: none;
    border: 1px solid var(--rule);
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .order-filter .chip:hover{ border-color: var(--ember-dim); color: var(--ink); }
  .order-filter .chip.active{
    border-color: var(--ember);
    color: var(--ember);
    background: rgba(201,138,75,0.08);
  }

  .splits{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    margin: 14px 0 40px;
    min-height: 18px;
    letter-spacing: 0.02em;
    line-height: 1.7;
    word-break: break-word;
  }
  .splits span{ color: var(--ember-dim); }
  .splits span.excluded{ color: #4a4e55; text-decoration: line-through; }

  /* status / source */
  .source-bar{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 36px;
    flex-wrap: wrap;
    line-height: 1.6;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#5a5f66; flex-shrink:0; }
  .dot.ok{ background:#7fae6a; }
  .dot.bad{ background:#b3563f; }
  .source-bar label{
    border: 1px solid var(--rule);
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .source-bar label:hover{ border-color: var(--ember); color: var(--ember); }
  .source-bar input[type=file]{ display:none; }

  /* results */
  .count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 20px;
  }
  .count strong{ color: var(--ember); font-weight: 500; }

  .book-group{
    margin-bottom: 8px;
  }
  .book-group .book-heading{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ember);
    padding-top: 20px;
    margin-bottom: 4px;
    border-top: 1px solid var(--rule);
  }
  .book-group:first-child .book-heading{
    border-top: none;
  }

  .verse{
    padding: 16px 0 16px 0;
    cursor: pointer;
    transition: background .15s;
    margin: 0 -8px;
    padding-left: 8px;
    padding-right: 8px;
    border-radius: 3px;
  }
  .verse:hover{ background: var(--bg-raised); }
  .verse + .verse{
    border-top: 1px solid var(--rule);
  }

  .verse .ref{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .verse .cv{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .verse .hint{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ember-dim);
    opacity: 0;
    transition: opacity .15s;
  }
  .verse:hover .hint{ opacity: 1; }
  .verse .text{
    font-size: clamp(17px, 4.5vw, 21px);
    line-height: 1.55;
    color: var(--ink);
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .empty, .error{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    padding: 32px 0;
    border-top: 1px solid var(--rule);
    line-height: 1.7;
  }
  .error{ color: #c98a6f; }

  /* chapter reading view */
  .chapter-view{ display:none; }
  .chapter-view.active{ display:block; }
  .search-view.hidden{ display:none; }

  .back-bar{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .back-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: none;
    border: 1px solid var(--rule);
    padding: 10px 16px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:hover{ border-color: var(--ember); color: var(--ember); }

  .chapter-title{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .chapter-heading{
    font-weight: 500;
    font-size: clamp(24px, 6vw, 32px);
    margin: 0 0 28px;
  }
  .chapter-heading em{ font-style: italic; color: var(--ember); }

  .cverse{
    padding: 12px 0;
  }
  .cverse + .cverse{ border-top: 1px solid var(--rule); }
  .cverse.highlight{
    background: rgba(201,138,75,0.08);
    margin: 0 -14px;
    padding: 12px 14px;
    border-radius: 3px;
    border-top: none;
  }
  .cverse .n{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ember-dim);
    margin-right: 10px;
  }
  .cverse.highlight .n{ color: var(--ember); }
  .cverse .t{
    font-size: clamp(17px, 4.5vw, 21px);
    line-height: 1.55;
  }

  ::selection{ background: var(--ember-dim); color: #fff; }

  @media (max-width: 480px){
    .source-bar{ font-size: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="search-view" id="searchView">
    <p class="eyebrow">Verse · Chapter · Number</p>
    <h1>Enter a number.<br>Read it back as <em>scripture</em>.</h1>
    <p class="sub">Type any string of digits. Every way it can be split into a chapter and a verse — <span style="color:var(--ink)">1:23</span>, <span style="color:var(--ink)">12:3</span> — gets checked against every book of the Bible.</p>

    <div class="entry">
      <input id="numInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="123" autocomplete="off" />
      <button class="go" id="goBtn">Find verses</button>
    </div>

    <div class="order-filter" id="orderFilter"></div>

    <div class="splits" id="splits"></div>

    <div class="source-bar">
      <span class="dot" id="sourceDot"></span>
      <span id="sourceLabel">checking for Files/bible.txt…</span>
      <label>load a file
        <input type="file" id="fileInput" accept=".txt" />
      </label>
    </div>

    <div id="results"></div>
  </div>

  <div class="chapter-view" id="chapterView">
    <div class="back-bar">
      <button class="back-btn" id="backBtn">&larr; back to search</button>
      <span class="chapter-title" id="chapterTitle"></span>
    </div>
    <h2 class="chapter-heading" id="chapterHeading"></h2>
    <div id="chapterVerses"></div>
  </div>

</div>

<script>
let verses = []; // {book, chapter, verse, text}
let bookOrderIndex = new Map(); // book name -> first-seen index (canonical order)
let loaded = false;
let currentDigits = '';
let orderMode = 'all'; // 'all' | pairIndex-key like "0" meaning only that split order

const sourceDot = document.getElementById('sourceDot');
const sourceLabel = document.getElementById('sourceLabel');
const results = document.getElementById('results');
const splitsEl = document.getElementById('splits');
const input = document.getElementById('numInput');
const orderFilterEl = document.getElementById('orderFilter');

const searchView = document.getElementById('searchView');
const chapterView = document.getElementById('chapterView');
const backBtn = document.getElementById('backBtn');
const chapterTitle = document.getElementById('chapterTitle');
const chapterHeading = document.getElementById('chapterHeading');
const chapterVerses = document.getElementById('chapterVerses');

function setSource(state, msg){
  sourceDot.className = 'dot ' + state;
  sourceLabel.textContent = msg;
}

// Parses common plain-text Bible formats, e.g.:
//   "Genesis 1:1 In the beginning God created..."
//   "Gen 1:1	In the beginning..."
//   "1 John 2:3 And hereby..."
function parseBible(text){
  const lines = text.split(/\r?\n/);
  const out = [];
  // greedy capture for the verse text so the FULL remainder of the line
  // (including any internal punctuation/colons) is kept, then trimmed.
  const re = /^\s*((?:[1-3]\s?)?[A-Za-z][A-Za-z .]*?)\s+(\d+):(\d+)\s+(.+)$/;
  bookOrderIndex = new Map();
  let current = null; // the verse currently being built, in case it wraps onto multiple lines
  for (const line of lines){
    if (!line.trim()) continue;
    const m = line.match(re);
    if (m){
      const book = m[1].trim();
      current = {
        book,
        chapter: parseInt(m[2], 10),
        verse: parseInt(m[3], 10),
        text: m[4].trim()
      };
      out.push(current);
      if (!bookOrderIndex.has(book)){
        bookOrderIndex.set(book, bookOrderIndex.size);
      }
    } else if (current){
      // continuation of the previous verse's text, wrapped onto its own line
      current.text += (current.text ? ' ' : '') + line.trim();
    }
  }
  return out;
}

async function tryLoadDefault(){
  try{
    const res = await fetch('Files/bible.txt');
    if (!res.ok) throw new Error('not found');
    const text = await res.text();
    verses = parseBible(text);
    if (verses.length === 0) throw new Error('no verses parsed');
    loaded = true;
    setSource('ok', `loaded /Files/bible.txt · ${verses.length.toLocaleString()} verses`);
  }catch(e){
    setSource('bad', 'no bible.txt found at /Files/ — load a .txt file below');
  }
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  setSource('', `reading ${file.name}…`);
  const text = await file.text();
  verses = parseBible(text);
  if (verses.length === 0){
    setSource('bad', `couldn't find any "Book chapter:verse text" lines in ${file.name}`);
    loaded = false;
    return;
  }
  loaded = true;
  setSource('ok', `loaded ${file.name} · ${verses.length.toLocaleString()} verses`);
});

// every way to split a digit string into (chapter, verse), no leading-zero halves
// ordered so smaller chapter numbers come first (e.g. 1:23 before 12:3)
function splitNumber(digits){
  const pairs = [];
  const seen = new Set();
  for (let i = 1; i < digits.length; i++){
    const a = digits.slice(0, i);
    const b = digits.slice(i);
    if (a.length > 1 && a[0] === '0') continue;
    if (b.length > 1 && b[0] === '0') continue;
    const chapter = parseInt(a, 10);
    const verse = parseInt(b, 10);
    const key = chapter + ':' + verse;
    if (seen.has(key)) continue;
    seen.add(key);
    pairs.push({chapter, verse});
  }
  return pairs;
}

function buildOrderFilter(pairs){
  orderFilterEl.innerHTML = '';
  if (pairs.length <= 1){
    return; // nothing to filter when there's only one possible split
  }

  const allChip = document.createElement('button');
  allChip.className = 'chip' + (orderMode === 'all' ? ' active' : '');
  allChip.textContent = 'all splits';
  allChip.addEventListener('click', () => { orderMode = 'all'; run(); });
  orderFilterEl.appendChild(allChip);

  pairs.forEach((p, i) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (orderMode === String(i) ? ' active' : '');
    chip.textContent = `${p.chapter}:${p.verse}`;
    chip.addEventListener('click', () => { orderMode = String(i); run(); });
    orderFilterEl.appendChild(chip);
  });
}

function render(digits){
  results.innerHTML = '';
  splitsEl.innerHTML = '';

  if (!digits){
    orderFilterEl.innerHTML = '';
    return;
  }

  const allPairs = splitNumber(digits);
  buildOrderFilter(allPairs);

  // reset to 'all' if the selected mode index no longer exists for this number
  if (orderMode !== 'all' && !allPairs[parseInt(orderMode, 10)]){
    orderMode = 'all';
    buildOrderFilter(allPairs);
  }

  const pairs = orderMode === 'all' ? allPairs : [allPairs[parseInt(orderMode, 10)]];

  splitsEl.innerHTML = allPairs.map((p, i) => {
    const included = orderMode === 'all' || orderMode === String(i);
    return `<span class="${included ? '' : 'excluded'}">${p.chapter}:${p.verse}</span>`;
  }).join(', ');

  if (!loaded){
    results.innerHTML = `<div class="error">No Bible text loaded yet. Point this app at /Files/bible.txt, or load a .txt file above.</div>`;
    return;
  }

  // collect matches, remembering which split-pair (order) each came from
  const matches = [];
  pairs.forEach((p, pairIndex) => {
    for (const v of verses){
      if (v.chapter === p.chapter && v.verse === p.verse){
        matches.push({...v, pairIndex});
      }
    }
  });

  if (matches.length === 0){
    results.innerHTML = `<div class="empty">No book in the loaded text has a verse at ${pairs.map(p=>p.chapter+':'+p.verse).join(' or ')}.</div>`;
    return;
  }

  // group by book, book order = canonical order (first appearance in source text)
  const groups = new Map(); // book -> array of matches
  for (const m of matches){
    if (!groups.has(m.book)) groups.set(m.book, []);
    groups.get(m.book).push(m);
  }

  const bookNames = [...groups.keys()].sort((a, b) => {
    const ai = bookOrderIndex.has(a) ? bookOrderIndex.get(a) : Infinity;
    const bi = bookOrderIndex.has(b) ? bookOrderIndex.get(b) : Infinity;
    return ai - bi;
  });

  const countEl = document.createElement('p');
  countEl.className = 'count';
  countEl.innerHTML = `<strong>${matches.length}</strong> verse${matches.length === 1 ? '' : 's'} found across <strong>${bookNames.length}</strong> book${bookNames.length === 1 ? '' : 's'}`;
  results.appendChild(countEl);

  for (const book of bookNames){
    const groupVerses = groups.get(book).sort((a, b) => a.pairIndex - b.pairIndex);

    const groupEl = document.createElement('div');
    groupEl.className = 'book-group';

    const heading = document.createElement('div');
    heading.className = 'book-heading';
    heading.textContent = book;
    groupEl.appendChild(heading);

    for (const v of groupVerses){
      const el = document.createElement('div');
      el.className = 'verse';
      el.innerHTML = `
        <div class="ref">
          <span class="cv">${v.chapter}:${v.verse}</span>
          <span class="hint">read full chapter &rarr;</span>
        </div>
        <div class="text">${v.text}</div>
      `;
      el.addEventListener('click', () => openChapter(v.book, v.chapter, v.verse));
      groupEl.appendChild(el);
    }

    results.appendChild(groupEl);
  }
}

function openChapter(book, chapter, highlightVerse){
  const chapterVersesList = verses
    .filter(v => v.book === book && v.chapter === chapter)
    .sort((a, b) => a.verse - b.verse);

  if (chapterVersesList.length === 0) return;

  chapterTitle.textContent = `${book} ${chapter}`;
  chapterHeading.innerHTML = `${book} <em>${chapter}</em>`;
  chapterVerses.innerHTML = '';

  for (const v of chapterVersesList){
    const el = document.createElement('div');
    el.className = 'cverse' + (v.verse === highlightVerse ? ' highlight' : '');
    el.innerHTML = `<span class="n">${v.verse}</span><span class="t">${v.text}</span>`;
    chapterVerses.appendChild(el);
  }

  searchView.classList.add('hidden');
  chapterView.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'auto' });

  // scroll the highlighted verse into view after layout settles
  requestAnimationFrame(() => {
    const hl = chapterVerses.querySelector('.highlight');
    if (hl) hl.scrollIntoView({ block: 'center', behavior: 'auto' });
  });
}

function closeChapter(){
  chapterView.classList.remove('active');
  searchView.classList.remove('hidden');
}

backBtn.addEventListener('click', closeChapter);

function run(){
  const digits = input.value.replace(/[^0-9]/g, '');
  currentDigits = digits;
  render(digits);
}

document.getElementById('goBtn').addEventListener('click', run);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
input.addEventListener('input', () => {
  const digits = input.value.replace(/[^0-9]/g, '');
  if (input.value !== digits) input.value = digits;
});

tryLoadDefault();
</script>
</body>
</html>
