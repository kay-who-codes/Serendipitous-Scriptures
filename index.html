<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Serendipitous Scriptures</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0b0d10;
    --bg-raised: #14171c;
    --ink: #ece7dc;
    --ink-dim: #8b8f96;
    --rule: #262b32;
    --ember: #c98a4b;
    --ember-dim: #6b5638;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(32px, 8vw, 64px) clamp(16px, 5vw, 24px) 100px;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ember);
    margin: 0 0 10px;
  }

  h1{
    font-weight: 500;
    font-size: clamp(28px, 8vw, 44px);
    line-height: 1.08;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  h1 em{
    font-style: italic;
    color: var(--ember);
  }

  .sub{
    color: var(--ink-dim);
    font-size: clamp(15px, 4vw, 19px);
    line-height: 1.5;
    margin: 0 0 32px;
    max-width: 52ch;
  }

  /* the input — a single ledger line */
  .entry{
    display:flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 12px 18px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 8px;
  }
  .entry input{
    flex: 1 1 140px;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(24px, 7vw, 34px);
    letter-spacing: 0.05em;
    padding: 6px 0;
    width: 100%;
  }
  .entry input::placeholder{ color: #3a3f47; }
  .entry .go{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: none;
    border: 1px solid var(--rule);
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
    flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  .entry .go:hover, .entry .go:active{ border-color: var(--ember); color: var(--ember); }

  .splits{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    margin: 14px 0 40px;
    min-height: 18px;
    letter-spacing: 0.02em;
    line-height: 1.7;
    word-break: break-word;
  }
  .splits span{ color: var(--ember-dim); }

  /* status / source */
  .source-bar{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 36px;
    flex-wrap: wrap;
    line-height: 1.6;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#5a5f66; flex-shrink:0; }
  .dot.ok{ background:#7fae6a; }
  .dot.bad{ background:#b3563f; }
  .source-bar label{
    border: 1px solid var(--rule);
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .source-bar label:hover{ border-color: var(--ember); color: var(--ember); }
  .source-bar input[type=file]{ display:none; }

  /* results */
  .count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 20px;
  }
  .count strong{ color: var(--ember); font-weight: 500; }

  .book-group{
    margin-bottom: 8px;
  }
  .book-group .book-heading{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ember);
    padding-top: 20px;
    margin-bottom: 4px;
    border-top: 1px solid var(--rule);
  }
  .book-group:first-child .book-heading{
    border-top: none;
  }

  .verse{
    padding: 16px 0 16px 0;
  }
  .verse + .verse{
    border-top: 1px solid var(--rule);
  }

  .verse .ref{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .verse .cv{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .verse .text{
    font-size: clamp(17px, 4.5vw, 21px);
    line-height: 1.55;
    color: var(--ink);
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .empty, .error{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    padding: 32px 0;
    border-top: 1px solid var(--rule);
    line-height: 1.7;
  }
  .error{ color: #c98a6f; }

  ::selection{ background: var(--ember-dim); color: #fff; }

  @media (max-width: 480px){
    .source-bar{ font-size: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Verse · Chapter · Number</p>
  <h1>Enter a number.<br>Read it back as <em>scripture</em>.</h1>
  <p class="sub">Type any string of digits. Every way it can be split into a chapter and a verse — <span style="color:var(--ink)">1:23</span>, <span style="color:var(--ink)">12:3</span> — gets checked against every book of the Bible.</p>

  <div class="entry">
    <input id="numInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="123" autocomplete="off" />
    <button class="go" id="goBtn">Find verses</button>
  </div>
  <div class="splits" id="splits"></div>

  <div class="source-bar">
    <span class="dot" id="sourceDot"></span>
    <span id="sourceLabel">checking for Files/bible.txt…</span>
    <label>load a file
      <input type="file" id="fileInput" accept=".txt" />
    </label>
  </div>

  <div id="results"></div>
</div>

<script>
let verses = []; // {book, chapter, verse, text}
let bookOrderIndex = new Map(); // book name -> first-seen index (canonical order)
let loaded = false;

const sourceDot = document.getElementById('sourceDot');
const sourceLabel = document.getElementById('sourceLabel');
const results = document.getElementById('results');
const splitsEl = document.getElementById('splits');
const input = document.getElementById('numInput');

function setSource(state, msg){
  sourceDot.className = 'dot ' + state;
  sourceLabel.textContent = msg;
}

// Parses common plain-text Bible formats, e.g.:
//   "Genesis 1:1 In the beginning God created..."
//   "Gen 1:1	In the beginning..."
//   "1 John 2:3 And hereby..."
function parseBible(text){
  const lines = text.split(/\r?\n/);
  const out = [];
  // greedy capture for the verse text so the FULL remainder of the line
  // (including any internal punctuation/colons) is kept, then trimmed.
  const re = /^\s*((?:[1-3]\s?)?[A-Za-z][A-Za-z .]*?)\s+(\d+):(\d+)\s+(.+)$/;
  bookOrderIndex = new Map();
  let current = null; // the verse currently being built, in case it wraps onto multiple lines
  for (const line of lines){
    if (!line.trim()) continue;
    const m = line.match(re);
    if (m){
      const book = m[1].trim();
      current = {
        book,
        chapter: parseInt(m[2], 10),
        verse: parseInt(m[3], 10),
        text: m[4].trim()
      };
      out.push(current);
      if (!bookOrderIndex.has(book)){
        bookOrderIndex.set(book, bookOrderIndex.size);
      }
    } else if (current){
      // continuation of the previous verse's text, wrapped onto its own line
      current.text += (current.text ? ' ' : '') + line.trim();
    }
  }
  return out;
}

async function tryLoadDefault(){
  try{
    const res = await fetch('Files/bible.txt');
    if (!res.ok) throw new Error('not found');
    const text = await res.text();
    verses = parseBible(text);
    if (verses.length === 0) throw new Error('no verses parsed');
    loaded = true;
    setSource('ok', `loaded /Files/bible.txt · ${verses.length.toLocaleString()} verses`);
  }catch(e){
    setSource('bad', 'no bible.txt found at /Files/ — load a .txt file below');
  }
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  setSource('', `reading ${file.name}…`);
  const text = await file.text();
  verses = parseBible(text);
  if (verses.length === 0){
    setSource('bad', `couldn't find any "Book chapter:verse text" lines in ${file.name}`);
    loaded = false;
    return;
  }
  loaded = true;
  setSource('ok', `loaded ${file.name} · ${verses.length.toLocaleString()} verses`);
});

// every way to split a digit string into (chapter, verse), no leading-zero halves
// ordered so smaller chapter numbers come first (e.g. 1:23 before 12:3)
function splitNumber(digits){
  const pairs = [];
  const seen = new Set();
  for (let i = 1; i < digits.length; i++){
    const a = digits.slice(0, i);
    const b = digits.slice(i);
    if (a.length > 1 && a[0] === '0') continue;
    if (b.length > 1 && b[0] === '0') continue;
    const chapter = parseInt(a, 10);
    const verse = parseInt(b, 10);
    const key = chapter + ':' + verse;
    if (seen.has(key)) continue;
    seen.add(key);
    pairs.push({chapter, verse});
  }
  return pairs;
}

function render(digits){
  results.innerHTML = '';
  splitsEl.innerHTML = '';

  if (!digits){
    return;
  }

  const pairs = splitNumber(digits);
  splitsEl.innerHTML = 'reading as ' + pairs.map(p => `<span>${p.chapter}:${p.verse}</span>`).join(', ');

  if (!loaded){
    results.innerHTML = `<div class="error">No Bible text loaded yet. Point this app at /Files/bible.txt, or load a .txt file above.</div>`;
    return;
  }

  // collect matches, remembering which split-pair (order) each came from
  const matches = [];
  pairs.forEach((p, pairIndex) => {
    for (const v of verses){
      if (v.chapter === p.chapter && v.verse === p.verse){
        matches.push({...v, pairIndex});
      }
    }
  });

  if (matches.length === 0){
    results.innerHTML = `<div class="empty">No book in the loaded text has a verse at ${pairs.map(p=>p.chapter+':'+p.verse).join(' or ')}.</div>`;
    return;
  }

  // group by book, book order = canonical order (first appearance in source text)
  const groups = new Map(); // book -> array of matches
  for (const m of matches){
    if (!groups.has(m.book)) groups.set(m.book, []);
    groups.get(m.book).push(m);
  }

  const bookNames = [...groups.keys()].sort((a, b) => {
    const ai = bookOrderIndex.has(a) ? bookOrderIndex.get(a) : Infinity;
    const bi = bookOrderIndex.has(b) ? bookOrderIndex.get(b) : Infinity;
    return ai - bi;
  });

  const countEl = document.createElement('p');
  countEl.className = 'count';
  countEl.innerHTML = `<strong>${matches.length}</strong> verse${matches.length === 1 ? '' : 's'} found across <strong>${bookNames.length}</strong> book${bookNames.length === 1 ? '' : 's'}`;
  results.appendChild(countEl);

  for (const book of bookNames){
    const groupVerses = groups.get(book).sort((a, b) => a.pairIndex - b.pairIndex);

    const groupEl = document.createElement('div');
    groupEl.className = 'book-group';

    const heading = document.createElement('div');
    heading.className = 'book-heading';
    heading.textContent = book;
    groupEl.appendChild(heading);

    for (const v of groupVerses){
      const el = document.createElement('div');
      el.className = 'verse';
      el.innerHTML = `
        <div class="ref">
          <span class="cv">${v.chapter}:${v.verse}</span>
        </div>
        <div class="text">${v.text}</div>
      `;
      groupEl.appendChild(el);
    }

    results.appendChild(groupEl);
  }
}

function run(){
  const digits = input.value.replace(/[^0-9]/g, '');
  render(digits);
}

document.getElementById('goBtn').addEventListener('click', run);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
input.addEventListener('input', () => {
  const digits = input.value.replace(/[^0-9]/g, '');
  if (input.value !== digits) input.value = digits;
});

tryLoadDefault();
</script>
</body>
</html>
